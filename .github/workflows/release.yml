name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate build artifact
        id: artifact
        run: echo "path=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar')" >> "$GITHUB_OUTPUT"

      - name: Read mod version
        id: version
        run: echo "tag=v$(grep -m1 '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
